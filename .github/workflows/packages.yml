name: packages

# Every push builds all three packages (downloadable from the run's artifacts).
# Bumping VERSION on master also publishes them as release v<VERSION>.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: .deb (debian/ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang python3 pkg-config \
            libfontconfig1-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui -> target\nkbd-idle -> target"
      - name: build
        run: ./packaging/build-deb.sh
      - name: verify contents
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | grep -E 'usr/bin/(83sc|legion83-gui)$'
          dpkg-deb -c dist/*.deb | grep -E 'usr/src/LenovoLegionLinux-83sc/dkms.conf$'
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: .rpm (fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
    steps:
      - name: install build deps
        run: |
          dnf -y install rpm-build rpmdevtools systemd-rpm-macros cargo rust gcc gcc-c++ clang \
            python3 fontconfig-devel git tar patch
      - uses: actions/checkout@v4
      # rpmbuild builds under ~/rpmbuild/BUILD, so the repo's target/ is never
      # reused. Point cargo at a fixed path and cache that instead.
      - name: prepare cache dir
        run: mkdir -p /cache/cargo /cache/target && chmod -R 777 /cache
      - uses: actions/cache@v4
        with:
          path: |
            /cache/cargo
            /cache/target
          key: rpm-cargo-${{ hashFiles('gui/Cargo.lock', 'kbd-idle/Cargo.lock') }}
          restore-keys: rpm-cargo-
      - name: build
        run: |
          VER="$(cat VERSION)"
          sed -i "s/^Version:.*/Version:        $VER/" packaging/83sc-control.spec
          mkdir -p /tmp/src/83sc-control-$VER
          cp -a . /tmp/src/83sc-control-$VER/
          tar czf /tmp/83sc-control-$VER.tar.gz -C /tmp/src 83sc-control-$VER
          rpmbuild -ta /tmp/83sc-control-$VER.tar.gz
          mkdir -p dist
          find "$(rpm --eval %{_rpmdir})" -name '*.rpm' ! -name '*debuginfo*' ! -name '*debugsource*' -exec cp {} dist/ \;
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    name: .pkg.tar.zst (arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: install build deps
        run: pacman -Syu --noconfirm rust clang python fontconfig git
      - uses: actions/checkout@v4
      - name: prepare cache dir
        run: mkdir -p /cache/cargo /cache/target && chmod -R 777 /cache
      - uses: actions/cache@v4
        with:
          path: |
            /cache/cargo
            /cache/target
          key: arch-cargo-${{ hashFiles('gui/Cargo.lock', 'kbd-idle/Cargo.lock') }}
          restore-keys: arch-cargo-
      # makepkg refuses to run as root, so build as a normal user
      - name: build
        run: |
          useradd -m builder
          chown -R builder:builder .
          chmod -R 777 /cache
          su builder -c 'export CARGO_HOME=/cache/cargo CARGO_TARGET_DIR=/cache/target; cd packaging && makepkg -f --nodeps --noconfirm'
          mkdir -p dist
          for f in packaging/*.pkg.tar.zst; do
            case "$f" in *-debug-*) continue;; esac
            mv "$f" dist/
          done
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  release:
    name: publish release on VERSION bump
    needs: [deb, rpm, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: new version?
        id: v
        run: |
          VER="$(cat VERSION)"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "v$VER already released, nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          generate_release_notes: true
